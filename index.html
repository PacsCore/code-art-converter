<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Art Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Code Art Converter</h1>
    <input type="file" id="upload" accept="image/*">
    <label>
        Detail <span id="colsValue">120</span>
        <input type="range" id="cols" min="40" max="300" value="120">
        Colors:
        <select id="mode">
            <option value="original">Original</option>
            <option value="matrix">Matrix</option>
            <option value="mono">Black/White</option>
        </select>
    </label>
    <label>
        <input type="checkbox" id="ide">
        IDE-Rahmen
    </label>
    <button id="download" type="button">PNG herunterladen</button>
    <canvas id="canvas"></canvas>
    <script src="script.js"></script>
</body>
</html>
